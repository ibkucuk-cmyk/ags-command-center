<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AGS Command Center — CRM</title>
    <meta name="description" content="Advanced Granite Solutions — Sales CRM Dashboard">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg: #0a0e17; --bg2: #111827; --card: #1a2236; --hover: #1e293b;
            --border: #1e3a5f; --border-act: #3b82f6;
            --text: #f1f5f9; --text2: #94a3b8; --muted: #64748b;
            --accent: #3b82f6; --green: #10b981; --amber: #f59e0b; --red: #ef4444; --purple: #8b5cf6;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; min-height:100dvh; }

        /* AUTH */
        .auth-screen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; }
        .auth-box { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:40px 32px; text-align:center; max-width:380px; width:100%; }
        .auth-box h1 { font-size:22px; font-weight:800; background:linear-gradient(135deg,#3b82f6,#8b5cf6); -webkit-background-clip:text; -webkit-text-fill-color:transparent; margin-bottom:6px; }
        .auth-box p { color:var(--muted); font-size:13px; margin-bottom:24px; }
        .auth-box input { width:100%; padding:12px 14px; background:var(--bg); border:1px solid var(--border); border-radius:8px; color:var(--text); font-family:inherit; font-size:14px; outline:none; margin-bottom:12px; }
        .auth-box input:focus { border-color:var(--accent); }
        .auth-box button { width:100%; padding:12px; background:linear-gradient(135deg,#3b82f6,#8b5cf6); border:none; border-radius:8px; color:#fff; font-family:inherit; font-size:14px; font-weight:600; cursor:pointer; }
        .auth-box button:hover { opacity:0.9; }
        .auth-err { color:var(--red); font-size:12px; margin-top:8px; min-height:18px; }

        /* LAYOUT */
        .app { display:none; flex-direction:column; min-height:100vh; min-height:100dvh; }
        .topbar { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; background:var(--bg2); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:100; }
        .topbar h1 { font-size:16px; font-weight:700; }
        .topbar .user-info { font-size:12px; color:var(--text2); display:flex; align-items:center; gap:8px; }
        .topbar .role-badge { padding:2px 8px; border-radius:10px; font-size:10px; font-weight:700; }
        .role-admin { background:rgba(139,92,246,0.2); color:var(--purple); }
        .role-salesperson { background:rgba(16,185,129,0.2); color:var(--green); }
        .btn-logout { background:none; border:1px solid var(--border); color:var(--text2); padding:6px 12px; border-radius:6px; font-size:11px; cursor:pointer; font-family:inherit; }

        /* TABS */
        .tabs { display:flex; background:var(--bg2); border-bottom:1px solid var(--border); overflow-x:auto; position:sticky; top:49px; z-index:99; }
        .tab { padding:10px 16px; font-size:13px; font-weight:500; color:var(--muted); cursor:pointer; white-space:nowrap; border-bottom:2px solid transparent; }
        .tab.active { color:var(--accent); border-bottom-color:var(--accent); }

        /* STATS */
        .stats-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; padding:16px; }
        .stat-card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px; }
        .stat-card .label { font-size:10px; text-transform:uppercase; letter-spacing:1px; color:var(--muted); }
        .stat-card .val { font-size:26px; font-weight:800; margin-top:4px; }
        .val-green { color:var(--green); } .val-blue { color:var(--accent); } .val-amber { color:var(--amber); } .val-purple { color:var(--purple); }

        /* FILTERS */
        .filters { padding:8px 16px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
        .filters select, .filters input { background:var(--card); border:1px solid var(--border); color:var(--text); padding:8px 10px; border-radius:6px; font-size:12px; font-family:inherit; outline:none; }
        .filters input { flex:1; min-width:150px; }
        .filters select:focus, .filters input:focus { border-color:var(--accent); }

        /* TABLE */
        .table-wrap { flex:1; overflow:auto; padding:0 8px 80px; }
        table { width:100%; border-collapse:collapse; font-size:12px; min-width:800px; }
        thead th { background:var(--bg2); padding:8px 10px; text-align:left; font-weight:600; color:var(--text2); border-bottom:2px solid var(--border); position:sticky; top:0; z-index:10; white-space:nowrap; }
        tbody td { padding:7px 10px; border-bottom:1px solid var(--border); color:var(--text2); max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        tbody tr:hover { background:var(--hover); }
        tbody tr.is-dnr { opacity:0.4; }
        tbody tr.is-cust { background:rgba(245,158,11,0.05); }

        /* CHECKBOXES */
        .cb { width:16px; height:16px; cursor:pointer; accent-color:var(--green); }

        /* ASSIGN */
        .assign-sel { background:var(--bg); border:1px solid var(--border); color:var(--text); padding:4px 6px; border-radius:4px; font-size:11px; font-family:inherit; cursor:pointer; }
        .assign-sel:focus { border-color:var(--accent); }

        /* STATUS INPUT */
        .status-input { background:transparent; border:1px solid transparent; color:var(--text2); padding:2px 4px; border-radius:4px; font-size:11px; width:100px; font-family:inherit; }
        .status-input:focus { border-color:var(--accent); background:var(--bg); color:var(--text); }

        /* STARS */
        .star-2 { color:var(--amber); font-weight:700; }
        .star-1 { color:var(--text); }

        /* ADD FORM */
        .add-panel { display:none; background:var(--card); border:1px solid var(--border); border-radius:12px; margin:16px; padding:20px; }
        .add-panel.show { display:block; }
        .add-panel h3 { font-size:14px; margin-bottom:12px; }
        .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
        .form-grid input, .form-grid select { background:var(--bg); border:1px solid var(--border); color:var(--text); padding:10px; border-radius:6px; font-size:13px; font-family:inherit; }
        .form-grid .full { grid-column:1/-1; }
        .btn-add { background:var(--green); border:none; color:#fff; padding:10px 20px; border-radius:8px; font-weight:600; cursor:pointer; margin-top:10px; font-family:inherit; }
        .btn-toggle-add { background:var(--card); border:1px solid var(--border); color:var(--green); padding:8px 16px; border-radius:8px; font-size:12px; font-weight:600; cursor:pointer; margin-left:16px; margin-bottom:8px; font-family:inherit; }

        /* MOBILE */
        @media(max-width:768px) {
            .stats-row { grid-template-columns:1fr 1fr; }
            .form-grid { grid-template-columns:1fr; }
            .topbar h1 { font-size:14px; }
        }

        /* LOADING */
        .loading { text-align:center; padding:60px; color:var(--muted); }

        /* MD CONTENT for sales tools */
        .md-view { padding:16px; max-width:800px; line-height:1.7; display:none; }
        .md-view.active { display:block; }
        .md-view h1 { font-size:22px; font-weight:800; margin-bottom:12px; border-bottom:2px solid var(--border); padding-bottom:8px; color:var(--accent); }
        .md-view h2 { font-size:17px; font-weight:700; margin:24px 0 8px; color:var(--accent); }
        .md-view h3 { font-size:14px; font-weight:600; margin:16px 0 6px; }
        .md-view p { margin:6px 0; color:var(--text2); font-size:13px; }
        .md-view ul, .md-view ol { padding-left:20px; margin:6px 0; }
        .md-view li { margin:3px 0; color:var(--text2); font-size:13px; }
        .md-view strong { color:var(--text); }
        .md-view blockquote { border-left:3px solid var(--accent); padding:8px 12px; margin:12px 0; background:rgba(59,130,246,0.08); border-radius:0 6px 6px 0; color:var(--text2); font-size:13px; }
        .md-view table { width:100%; border-collapse:collapse; margin:12px 0; font-size:12px; }
        .md-view thead th { background:var(--card); padding:8px; text-align:left; font-weight:600; border-bottom:2px solid var(--border); }
        .md-view tbody td { padding:6px 8px; border-bottom:1px solid var(--border); }
        .md-view code { background:var(--card); padding:1px 5px; border-radius:3px; font-size:11px; color:var(--green); }
        .md-view hr { border:none; border-top:1px solid var(--border); margin:20px 0; }
    </style>
</head>
<body>

<!-- AUTH SCREEN -->
<div class="auth-screen" id="authScreen">
    <div class="auth-box">
        <h1>AGS Command Center</h1>
        <p>Sales CRM — Sign in to continue</p>
        <input type="email" id="loginEmail" placeholder="Email address">
        <input type="password" id="loginPw" placeholder="Password" onkeyup="if(event.key==='Enter')doLogin()">
        <button onclick="doLogin()">Sign In</button>
        <div class="auth-err" id="authErr"></div>
    </div>
</div>

<!-- APP -->
<div class="app" id="app">
    <div class="topbar">
        <h1>AGS Command Center</h1>
        <div class="user-info">
            <span id="userName"></span>
            <span class="role-badge" id="roleBadge"></span>
            <button class="btn-logout" onclick="doLogout()">Sign Out</button>
        </div>
    </div>

    <div class="tabs" id="tabBar">
        <div class="tab active" onclick="showTab('prospects')">Prospects</div>
        <div class="tab" onclick="showTab('coldcall')">Call Scripts</div>
        <div class="tab" onclick="showTab('email')">Email</div>
        <div class="tab" onclick="showTab('linkedin')">LinkedIn</div>
        <div class="tab" onclick="showTab('whyags')">Why AGS</div>
    </div>

    <!-- PROSPECTS TAB -->
    <div id="tab-prospects">
        <div class="stats-row" id="statsRow"></div>

        <div class="filters">
            <input type="text" id="searchBox" placeholder="Search company, phone, location..." oninput="renderTable()">
            <select id="filterTier" onchange="renderTable()"><option value="">All Tiers</option></select>
            <select id="filterAssigned" onchange="renderTable()">
                <option value="">All</option>
                <option value="unassigned">Unassigned</option>
                <option value="mine">My Prospects</option>
            </select>
            <select id="filterStatus" onchange="renderTable()">
                <option value="">Any Status</option>
                <option value="active">Active Prospects</option>
                <option value="customer">Customers</option>
                <option value="dnr">DNR/Competitors</option>
            </select>
        </div>

        <button class="btn-toggle-add" onclick="toggleAddForm()">+ Add Prospect</button>

        <div class="add-panel" id="addPanel">
            <h3>Add New Prospect</h3>
            <div class="form-grid">
                <input id="newCompany" placeholder="Company Name *">
                <input id="newPhone" placeholder="Phone">
                <input id="newLocation" placeholder="Location">
                <input id="newContact" placeholder="Contact Person">
                <input id="newWebsite" placeholder="Website">
                <input id="newEmail" placeholder="Email">
                <input id="newType" placeholder="Type (Kitchen remodeler, etc.)">
                <input id="newSource" placeholder="Source (Google Maps, Referral, etc.)">
                <input class="full" id="newAngle" placeholder="AGS Angle / Notes">
            </div>
            <button class="btn-add" onclick="addProspect()">Save Prospect</button>
        </div>

        <div class="table-wrap">
            <table>
                <thead><tr>
                    <th>#</th><th>Company</th><th>Location</th><th>Phone</th><th>Type</th>
                    <th>Called</th><th>Email</th><th>Visit</th><th>LI</th>
                    <th>Assigned</th><th>Status</th>
                </tr></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <!-- SALES TOOL TABS -->
    <div class="md-view" id="tab-coldcall"></div>
    <div class="md-view" id="tab-email"></div>
    <div class="md-view" id="tab-linkedin"></div>
    <div class="md-view" id="tab-whyags"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
// === SUPABASE INIT ===
const SUPA_URL = 'https://pqqoiaodbxxrxhskloxy.supabase.co';
const SUPA_KEY = 'sb_publishable_s6mCkH8tRA_WLyVF6q1avg_vqrvUW4q';
const sb = supabase.createClient(SUPA_URL, SUPA_KEY);

let currentUser = null;
let userProfile = null;
let allProspects = [];
let allUsers = [];

// === AUTH ===
async function doLogin() {
    const email = document.getElementById('loginEmail').value.trim();
    const pw = document.getElementById('loginPw').value;
    document.getElementById('authErr').textContent = '';
    const { data, error } = await sb.auth.signInWithPassword({ email, password: pw });
    if (error) {
        document.getElementById('authErr').textContent = error.message;
        return;
    }
    await initApp();
}

async function doLogout() {
    await sb.auth.signOut();
    document.getElementById('app').style.display = 'none';
    document.getElementById('authScreen').style.display = 'flex';
}

async function checkSession() {
    const { data: { session } } = await sb.auth.getSession();
    if (session) await initApp();
}

async function initApp() {
    const { data: { user } } = await sb.auth.getUser();
    if (!user) return;
    currentUser = user;

    // Get profile
    const { data: profile } = await sb.from('profiles').select('*').eq('id', user.id).single();
    userProfile = profile || { name: user.email, role: 'salesperson' };

    document.getElementById('authScreen').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    document.getElementById('userName').textContent = userProfile.name;

    const badge = document.getElementById('roleBadge');
    badge.textContent = userProfile.role;
    badge.className = 'role-badge role-' + userProfile.role;

    // Hide admin-only features for salespeople
    if (userProfile.role !== 'admin') {
        document.getElementById('filterAssigned').style.display = 'none';
    }

    await loadProspects();
    await loadUsers();
    renderStats();
    populateFilters();
    renderTable();
}

// === DATA ===
async function loadProspects() {
    let query = sb.from('prospects').select('*').order('number', { ascending: true });

    // Salespeople only see assigned prospects
    if (userProfile.role !== 'admin') {
        query = query.eq('assigned_to', currentUser.id);
    }

    const { data, error } = await query.limit(2000);
    if (error) { console.error('Load error:', error); return; }
    allProspects = data || [];
}

async function loadUsers() {
    if (userProfile.role !== 'admin') return;
    const { data } = await sb.from('profiles').select('*');
    allUsers = data || [];
}

// === RENDER ===
function renderStats() {
    const active = allProspects.filter(p => !p.is_customer && !p.is_dnr);
    const called = active.filter(p => p.called).length;
    const emailed = active.filter(p => p.emailed).length;
    const assigned = active.filter(p => p.assigned_to).length;

    document.getElementById('statsRow').innerHTML = `
        <div class="stat-card"><div class="label">Total Prospects</div><div class="val val-green">${active.length}</div></div>
        <div class="stat-card"><div class="label">Called</div><div class="val val-blue">${called}</div></div>
        <div class="stat-card"><div class="label">Emailed</div><div class="val val-purple">${emailed}</div></div>
        <div class="stat-card"><div class="label">Assigned</div><div class="val val-amber">${assigned}</div></div>
    `;
}

function populateFilters() {
    const tiers = [...new Set(allProspects.map(p => p.tier).filter(Boolean))].sort();
    const sel = document.getElementById('filterTier');
    sel.innerHTML = '<option value="">All Tiers</option>' + tiers.map(t =>
        `<option value="${t}">${t.substring(0, 40)}</option>`
    ).join('');
}

function renderTable() {
    const search = document.getElementById('searchBox').value.toLowerCase();
    const tier = document.getElementById('filterTier').value;
    const assigned = document.getElementById('filterAssigned').value;
    const status = document.getElementById('filterStatus').value;

    let filtered = allProspects.filter(p => {
        if (search && !(p.company + ' ' + p.phone + ' ' + p.location + ' ' + p.contact + ' ' + p.ags_angle).toLowerCase().includes(search)) return false;
        if (tier && p.tier !== tier) return false;
        if (assigned === 'unassigned' && p.assigned_to) return false;
        if (assigned === 'mine' && p.assigned_to !== currentUser.id) return false;
        if (status === 'active' && (p.is_customer || p.is_dnr)) return false;
        if (status === 'customer' && !p.is_customer) return false;
        if (status === 'dnr' && !p.is_dnr) return false;
        return true;
    });

    const tbody = document.getElementById('tableBody');
    if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="11" style="text-align:center;padding:40px;color:var(--muted)">No prospects found</td></tr>';
        return;
    }

    tbody.innerHTML = filtered.slice(0, 500).map(p => {
        const cls = p.is_dnr ? 'is-dnr' : (p.is_customer ? 'is-cust' : '');
        const starTxt = p.stars === 2 ? '<span class="star-2">★★</span>' : (p.stars === 1 ? '<span class="star-1">★</span>' : '');

        // Assign dropdown (admin only)
        let assignHtml = '';
        if (userProfile.role === 'admin') {
            assignHtml = `<select class="assign-sel" onchange="assignTo(${p.id}, this.value)">
                <option value="">—</option>
                ${allUsers.map(u => `<option value="${u.id}" ${p.assigned_to === u.id ? 'selected' : ''}>${u.name}</option>`).join('')}
            </select>`;
        } else {
            const assignedUser = allUsers.find(u => u.id === p.assigned_to);
            assignHtml = assignedUser ? assignedUser.name : '—';
        }

        return `<tr class="${cls}">
            <td>${p.number || ''} ${starTxt}</td>
            <td title="${(p.ags_angle||'').replace(/"/g,'&quot;')}">${p.company}</td>
            <td>${p.location || ''}</td>
            <td>${p.phone ? `<a href="tel:${p.phone}" style="color:var(--green)">${p.phone}</a>` : '—'}</td>
            <td>${p.type || ''}</td>
            <td><input type="checkbox" class="cb" ${p.called?'checked':''} onchange="toggleField(${p.id},'called',this.checked)"></td>
            <td><input type="checkbox" class="cb" ${p.emailed?'checked':''} onchange="toggleField(${p.id},'emailed',this.checked)"></td>
            <td><input type="checkbox" class="cb" ${p.stopped_by?'checked':''} onchange="toggleField(${p.id},'stopped_by',this.checked)"></td>
            <td><input type="checkbox" class="cb" ${p.linkedin?'checked':''} onchange="toggleField(${p.id},'linkedin',this.checked)"></td>
            <td>${assignHtml}</td>
            <td><input class="status-input" value="${p.status||''}" onblur="updateStatus(${p.id},this.value)" placeholder="Notes..."></td>
        </tr>`;
    }).join('');
}

// === ACTIONS ===
async function toggleField(id, field, val) {
    await sb.from('prospects').update({ [field]: val }).eq('id', id);
    const p = allProspects.find(x => x.id === id);
    if (p) p[field] = val;
    renderStats();
}

async function updateStatus(id, val) {
    await sb.from('prospects').update({ status: val }).eq('id', id);
    const p = allProspects.find(x => x.id === id);
    if (p) p.status = val;
}

async function assignTo(id, userId) {
    const val = userId || null;
    await sb.from('prospects').update({ assigned_to: val }).eq('id', id);
    const p = allProspects.find(x => x.id === id);
    if (p) p.assigned_to = val;
    renderStats();
}

async function addProspect() {
    const company = document.getElementById('newCompany').value.trim();
    if (!company) { alert('Company name required'); return; }

    const row = {
        company,
        phone: document.getElementById('newPhone').value.trim(),
        location: document.getElementById('newLocation').value.trim(),
        contact: document.getElementById('newContact').value.trim(),
        website: document.getElementById('newWebsite').value.trim(),
        email: document.getElementById('newEmail').value.trim(),
        type: document.getElementById('newType').value.trim(),
        source: document.getElementById('newSource').value.trim(),
        ags_angle: document.getElementById('newAngle').value.trim(),
        tier: 'Added by Sales Team',
        assigned_to: currentUser.id,
    };

    const { error } = await sb.from('prospects').insert([row]);
    if (error) { alert('Error: ' + error.message); return; }

    // Clear form
    ['newCompany','newPhone','newLocation','newContact','newWebsite','newEmail','newType','newSource','newAngle'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('addPanel').classList.remove('show');

    await loadProspects();
    renderStats();
    renderTable();
}

function toggleAddForm() {
    document.getElementById('addPanel').classList.toggle('show');
}

// === TABS ===
function showTab(tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    event.target.classList.add('active');

    document.getElementById('tab-prospects').style.display = tab === 'prospects' ? '' : 'none';
    ['coldcall','email','linkedin','whyags'].forEach(t => {
        const el = document.getElementById('tab-' + t);
        el.classList.toggle('active', t === tab);
        if (t === tab && !el.dataset.loaded) loadMdTab(t);
    });
}

async function loadMdTab(tab) {
    const el = document.getElementById('tab-' + tab);
    el.innerHTML = '<div class="loading">Loading...</div>';
    const fileMap = { coldcall:'AGS_COLD_CALL_SCRIPTS.md', email:'AGS_EMAIL_OUTBOUND.md', linkedin:'AGS_LINKEDIN_OUTBOUND.md', whyags:'AGS_WHY_AGS_ONEPAGER.md' };

    // Embedded content from build, or fetch fallback
    if (window.mdContent && window.mdContent[tab]) {
        el.innerHTML = marked.parse(window.mdContent[tab]);
        el.dataset.loaded = '1';
        return;
    }

    try {
        const resp = await fetch(fileMap[tab]);
        if (!resp.ok) throw new Error();
        const text = await resp.text();
        el.innerHTML = marked.parse(text);
        el.dataset.loaded = '1';
    } catch {
        el.innerHTML = '<p style="color:var(--muted);padding:40px;text-align:center">Content not available. Run build script to embed.</p>';
    }
}

// === INIT ===
checkSession();
</script>
</body>
</html>
